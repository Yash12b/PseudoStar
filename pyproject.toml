[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fsoc-tracker"
version = "0.1.0"
description = "AI-Based Virtual Camera Tracking System for Coarse Alignment of Mobile Free Space Optical Communication (FSOC) Terminals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "FSOC Tracker Team" },
]
keywords = ["fsoc", "optical-communication", "tracking", "computer-vision", "camera"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
ai = [
    "torch>=2.0.0",
    "ultralytics>=8.0.0",
]
ai-train = [
    "torch>=2.0.0",
]
full = [
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
]
desktop = [
    "PySide6>=6.6.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
fsoc-tracker = "fsoc_tracker.app.main:main"
fsoc-sim = "fsoc_tracker.cli.run_simulation:main"
fsoc-bench = "fsoc_tracker.cli.run_benchmark:main"
fsoc-ai-train-visual = "fsoc_tracker.ai.train_visual:main"
fsoc-ai-generate-dataset = "fsoc_tracker.ai.generate_dataset:main"
fsoc-ai-evaluate-visual = "fsoc_tracker.ai.evaluate_visual:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fsoc_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM"]
